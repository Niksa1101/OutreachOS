name: CI

on:
  push:
  pull_request:

# A superseded run is wasted compute. Cancel it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Platform-agnostic work runs on the fast runner. This job also produces the
  # frontend/dist artifact that the Windows job consumes from checkpoint 2 —
  # tauri-build fails at build.rs time if frontendDist does not exist, and
  # building the frontend twice would be pure waste.
  frontend:
    name: frontend (lint, typecheck, test, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Cheap, platform-agnostic, and catches a bump that only reached one file.
      - name: Version divergence check
        run: node scripts/sync-version.mjs --check

      # Q89: the spec is produced in-process by `app.openapi()`, so this needs
      # Python but not a running sidecar. It lives on this job rather than the
      # Windows one because generating text is genuinely platform-agnostic and
      # Q122 keeps Node off the Windows runner.
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install backend dependencies
        run: uv sync --directory backend --frozen

      - name: Generated API types are current
        run: node scripts/gen-api-types.mjs --check

      - run: pnpm run format:check
      - run: pnpm run lint:js
      - run: pnpm run typecheck:js
      - run: pnpm run test:js
      - run: pnpm run build

      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 1

  # Windows is the only target platform, and the backend touches exactly the
  # things that differ there: path handling, SQLite file locking, and log
  # rotation while another process holds the file open. Ubuntu would report
  # green on all of it.
  #
  # This runner needs no Node (Q122). It consumes the frontend job's dist/
  # artifact instead, because tauri-build fails at build.rs time when
  # frontendDist does not exist and building the frontend twice is pure waste.
  windows:
    name: windows (rust + backend)
    runs-on: windows-latest
    needs: frontend
    steps:
      - uses: actions/checkout@v4

      # --- Rust -------------------------------------------------------------
      #
      # Q29: Rust is the most fragile code in P0 and the least covered by
      # tests, so `fmt --check` and `clippy` keep it from rotting silently.
      # Still no `tauri build` here — release builds stay manual per the PRD.

      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # Q122: on Windows the cargo target directory is large enough that an
      # uncached job dominates total run time.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: cargo fmt
        working-directory: src-tauri
        run: cargo fmt --all -- --check

      - name: cargo clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test
        working-directory: src-tauri
        run: cargo test

      # --- Backend ----------------------------------------------------------
      #
      # Q69: pytest runs here rather than on ubuntu. Windows is the only target
      # and the P0 backend touches exactly what differs — workspace path
      # handling, SQLite file locking, and a rotating log handler that fails to
      # rotate while another process holds the file open. Ubuntu would report
      # green on all of it.

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install backend dependencies
        run: uv sync --directory backend --frozen

      - run: uv run --directory backend ruff check .
      - run: uv run --directory backend ruff format --check .
      - run: uv run --directory backend mypy .
      - run: uv run --directory backend pytest
