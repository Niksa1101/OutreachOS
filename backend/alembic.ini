# Alembic configuration.
#
# Deliberately **URL-free**. The database lives in a user-chosen workspace, so
# there is no URL to write here — the connection is passed in through
# `config.attributes["connection"]` (see `alembic/env.py`).
#
# `sqlalchemy.url` is not merely omitted, it must stay omitted: ConfigParser
# does %-interpolation on values, so a workspace path containing a `%` would
# raise on a string the user chose. There is no escaping story worth having for
# a value that does not need to be here.

[alembic]
script_location = alembic
# Revision ids are hand-written and ordered; the date prefix keeps `versions/`
# readable without implying the filename is the identifier.
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = .
# Explicit, because the legacy default splits on spaces and colons — which a
# Windows path contains by definition.
path_separator = os

# No [loggers] / [handlers] / [formatters] sections.
#
# Q58: Alembic's stock `env.py` calls `fileConfig(config.config_file_name)`,
# which reconfigures the root logger and destroys the dictConfig handlers set up
# at boot. Migrations run at boot, so that call silently kills logging for the
# rest of the process. The call is deleted from env.py; these sections are gone
# so nothing can put it back and appear to have a reason.
