[project]
name = "outreachos-backend"
version = "0.1.0"
description = "OutreachOS local backend — FastAPI sidecar spawned and supervised by Tauri."
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
    "alembic>=1.14",
    "fastapi>=0.115",
    # Tech.md §9: pin exact; re-verify overlay golden PNGs on any Pillow bump.
    "pillow==11.1.0",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "sqlalchemy>=2.0",
    "uvicorn>=0.34",
]

[project.scripts]
outreachos-render = "outreachos_backend.rendering.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.14",
    "pyinstaller>=6.11",
    "pytest>=8.3",
    # The SSE bus is the only async surface in the application (Q31: everything
    # else is sync `def` endpoints), and its shutdown path is exactly the part
    # that cannot be tested synchronously.
    "pytest-asyncio>=0.25",
    # Exercises the app through the real ASGI stack — middleware, dependency
    # tree, exception handlers — without binding a port.
    "httpx>=0.28",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/outreachos_backend"]

# ---------------------------------------------------------------------------
# Ruff — lint and format. Line length matches Prettier so a mixed diff does not
# show two conventions. Ruff never touches TypeScript; Prettier never touches
# Python.
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# ANN is intentionally off: mypy --strict already requires annotations, and
# running both produces duplicate diagnostics for the same omission.
# Q184 import boundary is enforced by tests/rendering/test_import_boundary.py

[tool.ruff.lint.isort]
known-first-party = ["outreachos_backend"]

# ---------------------------------------------------------------------------
# mypy — strict. SQLAlchemy 2.x ships native typing, so no plugin is needed.
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
# Generated migration files are unannotated `op.` calls that produce dozens of
# strict-mode errors carrying no signal. Ruff still formats and lints them.
# `dist/` and `build/` are PyInstaller output — a second copy of the whole
# package that collides with the real one on module names.
exclude = ["^alembic/versions/", "^dist/", "^build/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "render: golden-frame and FFmpeg integration tests (requires vendor/ffmpeg)",
]
