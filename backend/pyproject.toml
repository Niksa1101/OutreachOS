[project]
name = "outreachos-backend"
version = "0.1.0"
description = "OutreachOS local backend — FastAPI sidecar spawned and supervised by Tauri."
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
    "alembic>=1.14",
    "fastapi>=0.115",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "sqlalchemy>=2.0",
    "uvicorn>=0.34",
]

[dependency-groups]
dev = [
    "mypy>=1.14",
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/outreachos_backend"]

# ---------------------------------------------------------------------------
# Ruff — lint and format. Line length matches Prettier so a mixed diff does not
# show two conventions. Ruff never touches TypeScript; Prettier never touches
# Python.
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# ANN is intentionally off: mypy --strict already requires annotations, and
# running both produces duplicate diagnostics for the same omission.

[tool.ruff.lint.isort]
known-first-party = ["outreachos_backend"]

# ---------------------------------------------------------------------------
# mypy — strict. SQLAlchemy 2.x ships native typing, so no plugin is needed.
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
# Generated migration files are unannotated `op.` calls that produce dozens of
# strict-mode errors carrying no signal. Ruff still formats and lints them.
exclude = ["^alembic/versions/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
