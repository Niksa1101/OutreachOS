[package]
name = "outreachos"
version = "0.1.0"
description = "OutreachOS desktop shell — window lifecycle and Python sidecar supervision."
edition = "2021"
rust-version = "1.82"
publish = false

# Tech.md §2: Rust is deliberately thin. It is a shell, not a third
# business-logic layer. Everything below exists to start a window, start a
# sidecar, or explain why one of those failed.

[lib]
# The logic worth testing (workspace validation, path canonicalization, monitor
# clamping, the @@OOS control-line parser) lives in the library so `cargo test`
# reaches it without a Tauri runtime — Q107.
name = "outreachos_lib"
crate-type = ["lib"]

[[bin]]
name = "outreachos"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

# ADR-0003 / Q49: final plugin set. No `fs`, no `shell` (manual spawn is what
# gives us CREATE_NO_WINDOW, the Job Object, and a stdin we hold open), no `log`
# (tracing writes boot.log directly — see Q63).
tauri-plugin-dialog = "2"
tauri-plugin-store = "2"
tauri-plugin-window-state = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Q63: tracing + tracing-appender rather than a hand-rolled appender. `tracing`
# is a crate, not a Tauri plugin, so this does not reverse Q49. Rust most needs
# to log precisely when Python is dead or never started.
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["std", "fmt"] }
tracing-appender = "0.2"

time = { version = "0.3", features = ["formatting", "macros"] }
uuid = { version = "1", features = ["v4"] }

[profile.release]
# The sourcemap story is on the frontend side (Q100). Rust just ships small.
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
